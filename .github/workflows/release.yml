# Publishes a release when a tag like v0.1.0 is pushed: the libraries to Maven Central, and the server's image
# to GitHub's container registry, tagged with the version and latest. The version comes from the tag.
#
# The upload is left in the Central Portal for a manual "Publish" after checking it there, because a release on
# Maven Central can never be changed or removed. Once releases are routine, publishAndReleaseToMavenCentral
# would release automatically instead.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags look like v1.2.3; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: ./gradlew build -Pversion=${{ steps.version.outputs.version }}
      - run: ./gradlew publishToMavenCentral -Pversion=${{ steps.version.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - run: |
          IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export IMAGE_CREATED
          ./gradlew :as-app:jib -Pversion=${{ steps.version.outputs.version }} \
              -Djib.to.image="ghcr.io/michaelplomer/iter8-oauth:${{ steps.version.outputs.version }}" \
              -Djib.to.tags="latest"
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
