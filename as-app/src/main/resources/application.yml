spring:
  application:
    name: iter8-oauth

server:
  # Cloud Run injects PORT; default 8080 locally.
  port: ${PORT:8080}

iter8:
  oauth:
    # Stamped into every token and checked on every one. Required: set it to this server's public URL in
    # deployment. The default only suits a local run.
    issuer: ${ITER8_OAUTH_ISSUER:http://localhost:${server.port}}
    keys:
      # base64 (X.509 public / PKCS#8 private) or PEM. Absent halves are generated per run (dev only).
      jws-public-key: ${ITER8_OAUTH_JWS_PUBLIC_KEY:}
      jws-private-key: ${ITER8_OAUTH_JWS_PRIVATE_KEY:}
      refresh-token-key: ${ITER8_OAUTH_REFRESH_TOKEN_KEY:}
      # SEALED_CREDENTIAL keys are not configured here: each resource server publishes its own encryption key,
      # which the AS discovers from that resource's RFC 9728 metadata.
    # Clients that skip the consent page, by exact client identifier URL. Every other client is shown to the
    # user for approval before the user is sent to the upstream provider. List only clients you recognize,
    # for example the metadata URLs of the MCP clients you use.
    trusted-clients: []
    # Providers and their resource mapping are configured per deployment, e.g.:
    #   providers:
    #     google-oidc:
    #       type: oidc-identity
    #       client-id: ...           # from Google Cloud console
    #       client-secret: ...
    #       authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    #       token-uri: https://oauth2.googleapis.com/token
    #       jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    #       accepted-issuers: [https://accounts.google.com, accounts.google.com]
    #       requested-scope: openid email
    #       allowed-hosted-domains: [example.com]
    #       allowed-emails: []
    #       scopes-supported: [notes.read, notes.write]
    #   resources:
    #     "[https://notes.example.com/mcp]": google-oidc
    #   default-provider: google-oidc
    providers: {}
    resources: {}

logging:
  level:
    de.iter8.oauth: INFO
