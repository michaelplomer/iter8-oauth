[versions]
# Spring Boot 4 line, Java 25, Gradle 9.x.
springBoot = "4.1.2"
springDependencyMgmt = "1.1.7"
# Publishes the libraries to Maven Central through the Central Portal, signed.
vanniktechPublish = "0.37.0"
# Builds the authorization server's container image without a Docker daemon.
jib = "3.5.4"
# Not managed by the Boot 4.1 BOM (comes transitively via Spring Security); pinned explicitly.
nimbus = "10.10"

[libraries]
# Gradle plugin artifacts consumed by buildSrc convention plugins.
spring-boot-gradlePlugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
spring-dependencyManagement-gradlePlugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springDependencyMgmt" }
vanniktech-publish-gradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktechPublish" }

# Runtime libraries (versions supplied by the Spring Boot BOM).
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus" }

[plugins]
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
